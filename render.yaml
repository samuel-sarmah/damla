databases:
  - name: bottled-water-db
    plan: free
    postgresVersion: 16

services:
  - type: web
    name: bottled-water-trnc
    env: ruby
    plan: free
    buildCommand: "bundle install && bundle exec rails assets:precompile && bundle exec rails db:migrate"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: STAFF_SEED_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bottled-water-db
          property: connectionString
      - key: RAILS_ENV
        value: production
